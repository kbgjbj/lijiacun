<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0c1e">
<meta name="description" content="李俊澄的像素冒险档案：7 处情报、两场口味认证、一间秘密基地，以及一张可以盖章的冒险者执照。重庆移通学院 · 信息安全 · INFP。">
<meta property="og:type" content="website">
<meta property="og:title" content="李俊澄的冒险档案 · JUNCHENG QUEST">
<meta property="og:description" content="7 处情报、两场口味认证、一间秘密基地。单文件、零框架、纯手工像素。">
<meta property="og:locale" content="zh_CN">
<meta name="format-detection" content="telephone=yes">
<title>李俊澄的冒险档案 · JUNCHENG QUEST</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0c1e'/%3E%3Crect x='4' y='3' width='8' height='3' fill='%23f8c848'/%3E%3Crect x='3' y='6' width='10' height='6' fill='%23ffdcc2'/%3E%3Crect x='5' y='8' width='1' height='1' fill='%2323232e'/%3E%3Crect x='10' y='8' width='1' height='1' fill='%2323232e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vp-tw/cjk-web-fonts-fusion-pixel-font@0.0.1/dist/12px/proportional/zh_hans/Fusion-Pixel-12px-Proportional-Simplified-Chinese.css">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ============ 基础 ============ */
:root{
  --ink:#e8e8f0; --gold:#f8c848; --paper:#f2e8cc;
  --winA:#283070; --winB:#1a2250; --frame:#f0f0f4;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#05070f;color:var(--ink);overflow:hidden;user-select:none;
  font-family:'Fusion Pixel 12px Proportional Simplified Chinese','Press Start 2P',ui-monospace,'Courier New',monospace;
  font-size:14px;line-height:1.7;-webkit-font-smoothing:none;
}
input,textarea{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.en{font-family:'Press Start 2P',ui-monospace,monospace;letter-spacing:1px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ============ CRT 扫描线 ============ */
#crt{position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
#crt::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 90% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.42) 100%)}
@keyframes hueSpin{to{filter:hue-rotate(360deg)}}
/* 彩虹只作用在场景层，不动 #game 的 crtOn 动画（否则彩虹结束后会再闪一次） */
body.rainbow #scene,body.rainbow #hud,body.rainbow #dialog{animation:hueSpin 1s linear infinite}

/* ============ 标题画面 ============ */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;padding:24px;text-align:center;
  background:radial-gradient(ellipse at 50% 125%,#1c2a5e 0%,#0a0c1e 62%)}
#tSky{position:absolute;inset:0;width:100%;height:100%}
/* 关键修复：内容层压 1，星空层压 0，且不能让 #title>* 把 #tSky / .t-foot 的 position 覆盖掉 */
#title>*{position:relative;z-index:1}
#title>#tSky{position:absolute;inset:0;z-index:0}
#title>.t-foot{position:absolute;bottom:14px;left:0;right:0;z-index:1}
.t-present{font-size:10px;color:#8a9ac8;letter-spacing:3px}
#title h1{font-size:clamp(26px,6vw,50px);color:#fff;letter-spacing:4px;
  text-shadow:3px 3px 0 #101430,6px 6px 0 rgba(88,116,255,.4);margin:4px 0}
.t-sub{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.t-chip{background:#141c48;border:3px solid #3a4a88;padding:3px 10px;font-size:12px;color:#cfe0ff}
#tAvWrap{margin:14px 0 6px;background:#0c1030;border:4px solid var(--frame);padding:6px;
  box-shadow:0 0 0 4px #0c0c1c,8px 8px 0 rgba(0,0,0,.4)}
#tAvWrap::after{content:"李俊澄 · " attr(data-lv);display:block;font-size:10px;color:#8a9ac8;margin-top:4px}
#tAv{display:block}
#tMenu{display:flex;flex-direction:column;gap:12px;min-width:250px}
.t-note{font-size:11px;color:#8a9ac8;letter-spacing:2px}
.t-foot{position:absolute;bottom:14px;left:0;right:0;font-size:10px;color:#8894b8;letter-spacing:1px}
#title.gone{display:none}

/* ============ 像素按钮 ============ */
.pxbtn{background:var(--gold);color:#241a04;border:3px solid #fff;
  padding:10px 24px;font-size:14px;font-weight:bold;letter-spacing:2px;
  box-shadow:0 5px 0 #a07020,inset -3px -3px 0 rgba(0,0,0,.18)}
.pxbtn:hover{filter:brightness(1.08)}
.pxbtn:active{transform:translateY(5px);box-shadow:0 0 0 #a07020,inset -3px -3px 0 rgba(0,0,0,.18)}
.pxbtn.ghost{background:#141c48;color:var(--ink);border-color:#3a4a88;box-shadow:0 5px 0 #0a0e28}
.pxbtn.danger{background:#e05a5a;color:#fff;box-shadow:0 5px 0 #802020}
.pxbtn.sm{font-size:11px;padding:6px 14px;letter-spacing:1px;box-shadow:0 4px 0 #a07020}
.pxbtn.ghost.sm{box-shadow:0 4px 0 #0a0e28}
.pxbtn.pulse{animation:btnPulse 1.3s ease-in-out infinite}
@keyframes btnPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* ============ 游戏主画面 ============ */
#game{display:none;flex-direction:column;height:100vh;height:100dvh}
#game.on{display:flex}
#game.poweron{animation:crtOn .55s both}
@keyframes crtOn{0%{filter:brightness(4) contrast(2);transform:scale(.97)}55%{filter:brightness(.6)}100%{filter:none;transform:none}}

/* HUD */
#hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 12px;background:#0c1030;border-bottom:4px solid #2a3470;z-index:5}
.hud-l{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer}
.hud-l b{color:var(--gold)}
.bar{width:110px;height:12px;background:#05070f;border:3px solid var(--frame)}
.bar i{display:block;height:100%;width:0;background:#58e888;transition:width .5s steps(6)}
.bar.full i{background:var(--gold)}
.hud-r{display:flex;gap:8px}
.hud-btn{background:#141c48;border:3px solid #3a4a88;padding:4px 10px;font-size:12px}
.hud-btn:hover{border-color:var(--frame)}

/* 场景 */
#scene{flex:1;min-height:0;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#0a0c22 0%,#101430 70%,#141c48 100%)}
#sky{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.v-sign{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2;
  background:#8a5830;border:3px solid #241608;color:#ffe8c0;padding:5px 16px;font-size:13px;
  box-shadow:inset 0 -4px 0 #6a4220,0 4px 0 rgba(0,0,0,.35)}
#village{position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:center;
  align-items:flex-end;flex-wrap:wrap;gap:8px 14px;padding:0 10px;z-index:2}
#ground{position:absolute;left:0;right:0;bottom:0;height:26px;z-index:2;
  background:linear-gradient(180deg,#173225 0 5px,#122518 5px 100%);
  box-shadow:inset 0 5px 0 #1f4a2e}
#ground::before{content:"";position:absolute;top:-7px;left:0;right:0;height:7px;
  background:repeating-linear-gradient(90deg,transparent 0 12px,#1f4a2e 12px 16px,transparent 16px 27px)}

/* 小英雄 */
#hero{position:absolute;right:6%;bottom:26px;z-index:3;cursor:pointer;text-align:center;touch-action:manipulation}
#hero canvas{display:block;animation:heroBob 2.2s ease-in-out infinite}
.hero-shadow{width:34px;height:6px;margin:2px auto 0;
  background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%)}
@keyframes heroBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* 建筑 */
.bld{--rc:#888;--wc:#333;position:relative;width:110px;cursor:pointer;flex:0 0 auto;
  transition:transform .12s;touch-action:manipulation}
.bld:not(.secret):hover{transform:translateY(-5px)}
.bld:not(.secret):active{transform:translateY(-1px)}
.b-mark{position:absolute;top:-27px;left:50%;transform:translateX(-50%);width:22px;height:22px;
  background:var(--gold);border:3px solid #241a04;color:#241a04;font-weight:bold;
  display:flex;align-items:center;justify-content:center;animation:markBob 1.2s ease-in-out infinite;z-index:2}
.bld.done .b-mark{display:none}
@keyframes markBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.b-roof{height:30px;margin:0 -5px;background:var(--rc);
  clip-path:polygon(0 100%,0 55%,15% 55%,15% 25%,30% 25%,30% 0,70% 0,70% 25%,85% 25%,85% 55%,100% 55%,100% 100%);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.28)}
.b-body{height:70px;background:var(--wc);border:3px solid #0c0c1c;border-top:none;position:relative}
.b-win{position:absolute;top:11px;width:18px;height:18px;background:#ffd84a;
  box-shadow:inset 0 0 0 3px #0c0c1c;animation:winFlick 5s infinite}
.b-win.w1{left:13px}
.b-win.w2{right:13px;animation-delay:2.1s}
@keyframes winFlick{0%,93%,100%{background:#ffd84a}95%,97%{background:#c8a030}}
.b-door{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);width:26px;height:34px;
  background:#14141f;border:3px solid #0c0c1c;border-bottom:none}
.b-door::after{content:"";position:absolute;right:4px;top:14px;width:3px;height:3px;background:var(--gold)}
.b-sign{margin:6px auto 0;display:flex;align-items:center;gap:5px;justify-content:center;
  background:#0c0c1c;border:3px solid var(--frame);color:var(--ink);
  padding:3px 8px;font-size:11px;min-height:25px;width:fit-content;max-width:110px}
.bld.done .b-sign{border-color:var(--gold);color:var(--gold)}
.bld.done .b-sign::after{content:"✓"}
.bld.secret{display:none}
.bld.secret.show{display:block;animation:secretIn .8s steps(8) both}
.bld.secret.show .b-roof{background:linear-gradient(90deg,#f05a5a,#f8c848,#58e888,#58a8f8,#a86ae0)}
@keyframes secretIn{from{opacity:0;transform:translateY(24px) scale(.6)}to{opacity:1;transform:none}}

/* ============ 对话框 ============ */
#dialog{height:112px;flex:none;position:relative;cursor:pointer;display:flex;gap:12px;padding:10px 14px 12px;
  background:linear-gradient(180deg,var(--winA),var(--winB));border-top:4px solid var(--frame);z-index:5}
.d-name{position:absolute;top:-13px;left:64px;background:var(--gold);color:#241a04;
  padding:1px 12px;font-size:11px;font-weight:bold;border:3px solid #241a04}
#avWrap{flex:none;background:#0c1030;border:3px solid var(--frame);padding:3px;align-self:flex-start;cursor:pointer}
#dText{flex:1;padding-top:4px;font-size:14px;color:#fff;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:thin}
#dNext{position:absolute;right:14px;bottom:6px;color:var(--gold);animation:nextBlink .7s steps(2) infinite;visibility:hidden}
#dNext.show{visibility:visible}
@keyframes nextBlink{50%{opacity:0}}

/* ============ 弹窗(RPG窗口) ============ */
#modal{position:fixed;inset:0;background:rgba(4,6,16,.8);display:none;
  align-items:center;justify-content:center;z-index:60;padding:14px;overscroll-behavior:contain}
#modal.show{display:flex}
.win{width:min(680px,100%);max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--winA),var(--winB));border:4px solid var(--frame);
  box-shadow:0 0 0 4px #0c0c1c,12px 12px 0 rgba(0,0,0,.45)}
.win-head{display:flex;align-items:center;gap:10px;padding:10px 14px;flex:none;
  background:rgba(0,0,0,.35);border-bottom:4px solid rgba(255,255,255,.25)}
.win-head .w-ic{font-size:18px}
.win-head .w-tt{flex:1;font-weight:bold;letter-spacing:2px}
.win-close{width:30px;height:30px;background:#e05a5a;border:3px solid #fff;color:#fff;
  font-weight:bold;box-shadow:0 3px 0 #802020;flex:none}
.win-close:active{transform:translateY(3px);box-shadow:none}
.win-body{overflow-y:auto;padding:16px;overscroll-behavior:contain}
.win-body::-webkit-scrollbar{width:12px}
.win-body::-webkit-scrollbar-track{background:#0c1030}
.win-body::-webkit-scrollbar-thumb{background:#4a5aa0;border:3px solid #1a2250}
.room-intro{color:#9ab0e8;font-size:13px;margin-bottom:14px}

/* ============ 存档卡 ============ */
.save-top{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.av-big{flex:none;background:#0c1030;border:4px solid var(--frame);padding:8px;cursor:pointer;
  align-self:flex-start;box-shadow:0 0 0 4px #0c0c1c}
.av-big::after{content:"▲ 点我换表情";display:block;font-size:10px;color:#8a9ac8;margin-top:5px;text-align:center}
.stat-grid{flex:1;min-width:230px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:#141c40;border:3px solid var(--frame);padding:6px 9px}
.stat .k{display:block;font-size:10px;color:#8a9ac8;letter-spacing:1px}
.stat .v{font-size:13px;color:#fff;font-weight:bold}
.stat .v.sm{font-size:11px;font-weight:normal;line-height:1.5}
.vrow{margin:10px 0}
.vrow label{display:block;font-size:11px;color:#9ab0e8;margin-bottom:4px;letter-spacing:1px}
.vbar{height:18px;background:#05070f;border:3px solid var(--frame);position:relative}
.vbar i{display:block;height:100%;width:0;transition:width .9s steps(10);background:linear-gradient(90deg,#e05a5a,#f88a5a)}
.vbar.mp i{background:linear-gradient(90deg,#58a8f8,#88c8f8)}
.vbar.exp i{background:linear-gradient(90deg,#38c868,#8ae888)}
.vbar span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:18px;color:#fff;letter-spacing:1px}
.buffs{margin:10px 0}
.chip{display:inline-block;background:#2a3a6a;border:2px solid #8890c8;padding:2px 8px;margin:3px 3px 0 0;font-size:11px;color:#cfe0ff}
.flavor{margin-top:12px;padding:10px;background:rgba(0,0,0,.25);border-left:4px solid var(--gold);
  font-size:12px;color:#b8c4e8}

/* ============ 武器库 ============ */
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.skcard{display:flex;gap:10px;align-items:flex-start;background:#141c40;border:3px solid var(--frame);
  padding:10px;cursor:pointer;transition:transform .12s}
.skcard:hover{transform:translateY(-3px);border-color:var(--gold)}
.skcard.wig{animation:wig .4s}
@keyframes wig{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.sk-ic{font-size:24px;flex:none;width:34px;text-align:center}
.sk-nm{font-weight:bold;font-size:14px}
.sk-stars{color:var(--gold);font-size:12px;letter-spacing:2px}
.sk-type{font-size:10px;color:#8a9ac8;margin-left:6px}
.skcard p{font-size:11px;color:#b8c4e8;margin-top:4px}
.sec-div{font-size:11px;color:var(--gold);letter-spacing:3px;margin:16px 0 8px;
  border-bottom:2px dashed #3a4a88;padding-bottom:4px}

/* ============ 任务板 ============ */
.qrow{display:flex;gap:10px;align-items:flex-start;background:#141c40;border:3px solid var(--frame);
  padding:10px;margin-bottom:10px}
.q-ic{font-size:20px;flex:none}
.q-main{flex:1}
.q-tt{font-weight:bold;font-size:13px}
.qrow p{font-size:11px;color:#b8c4e8;margin-top:3px}
.q-st{flex:none;font-size:10px;padding:2px 8px;border:2px solid;letter-spacing:1px;white-space:nowrap}
.q-st.doing{color:var(--gold);border-color:var(--gold)}
.q-st.done{color:#58e888;border-color:#58e888}
.q-st.lock{color:#6a749a;border-color:#6a749a}
.q-prog{margin:6px 0 14px}
.q-prog label{font-size:11px;color:#9ab0e8}
.q-prog .vbar{margin-top:4px}
.q-prog .vbar i{background:linear-gradient(90deg,#e0a848,#f8d868)}

/* ============ 编年史 ============ */
.tl{position:relative;padding-left:24px;margin-left:6px;border-left:4px dashed #3a4a88}
.tl-item{position:relative;margin-bottom:16px;background:#141c40;border:3px solid var(--frame);padding:8px 12px}
.tl-item::before{content:"";position:absolute;left:-33px;top:12px;width:10px;height:10px;
  background:var(--gold);border:3px solid #0c0c1c;box-shadow:0 0 0 3px var(--frame)}
.tl-date{font-size:11px;color:var(--gold);letter-spacing:1px}
.tl-item h4{font-size:14px;margin:2px 0}
.tl-item p{font-size:11px;color:#b8c4e8}
.tl-item.now{border-color:#58e888}
.tl-item.now::before{background:#58e888;animation:markBob 1.4s infinite}
.tl-item.mist{border-style:dashed;border-color:#6a749a;color:#8a9ac8}

/* ============ 宝箱屋 ============ */
#chest{position:relative;width:132px;height:86px;margin:22px auto 4px;cursor:pointer;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.35));transition:transform .15s}
#chest:not(.open):hover{transform:scale(1.04)}
#chest::before{content:"";position:absolute;top:30px;left:50%;transform:translateX(-50%);
  width:20px;height:20px;background:var(--gold);border:4px solid #241608;z-index:2;transition:top .4s}
.ch-lid{position:absolute;top:0;left:0;right:0;height:36px;background:#8a5830;border:4px solid #241608;
  box-shadow:inset 0 -10px 0 #6a4220,inset 0 4px 0 #a87848;transition:transform .45s cubic-bezier(.2,1.5,.4,1)}
.ch-base{position:absolute;bottom:0;left:0;right:0;height:46px;background:#a87848;border:4px solid #241608;
  box-shadow:inset 0 10px 0 #8a5830}
#chest.open .ch-lid{transform:translateY(-24px) rotate(-5deg)}
#chest.open::before{top:12px}
.ch-hint{text-align:center;font-size:11px;color:#8a9ac8;margin-bottom:14px}
#tItems{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.titem{background:#141c40;border:3px solid var(--frame);padding:10px;opacity:0}
.titem.pop{animation:tPop .45s both}
@keyframes tPop{from{opacity:0;transform:scale(.6) translateY(16px)}60%{opacity:1;transform:scale(1.07)}to{opacity:1;transform:none}}
.titem.wide{grid-column:1/-1}
.t-rank{font-size:10px;color:var(--gold);letter-spacing:1px}
.titem h4{font-size:14px;margin:2px 0}
.titem p{font-size:11px;color:#b8c4e8}
.titem b{color:#ffe8b0}
.np{margin:8px 0;background:#0c1030;border:3px solid var(--frame);padding:7px 10px;
  display:flex;align-items:center;font-size:11px;color:#9ab0e8;flex-wrap:wrap}
.eq{display:inline-flex;gap:3px;height:20px;align-items:flex-end;margin:0 6px}
.eq i{width:5px;height:20px;background:#58e888;transform-origin:bottom;animation:eqB .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.18s}
.eq i:nth-child(3){animation-delay:.36s}
.eq i:nth-child(4){animation-delay:.1s}
.eq i:nth-child(5){animation-delay:.28s}
@keyframes eqB{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.artist{display:flex;gap:10px;align-items:baseline;background:rgba(0,0,0,.25);border-left:4px solid #a86ae0;
  padding:6px 10px;margin-top:8px}
.artist b{font-size:13px}
.artist span{font-size:11px;color:#b8c4e8}
.tags{margin-top:8px}
.tag{display:inline-block;background:#32284a;border:2px solid #a86ae0;color:#d8c0f8;
  padding:2px 10px;margin-right:6px;font-size:11px}

/* ============ 小游戏（口味认证） ============ */
.mg{margin-top:10px;background:#0c1030;border:3px solid #3a4a88;padding:10px}
.mg-t{font-size:12px;color:var(--gold);letter-spacing:1px;margin-bottom:8px}
.mg-lab{display:block;font-size:10px;color:#8a9ac8;margin:8px 0 4px;letter-spacing:1px}
.mg-lab:first-of-type{margin-top:0}
.mg-row{display:flex;flex-wrap:wrap;gap:6px}
.mg-p,.mg-s{background:#141c40;border:2px solid #3a4a88;color:#cfe0ff;padding:4px 9px;

/* ---------- BGM 序列器（已修：拼写 + 积压保护） ---------- */
const NOTE=n=>{
  const m={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
  return 440*Math.pow(2,(m[n.slice(0,-1)]-9)/12+(+n.slice(-1)-4));
};
const LEAD=[
  'E5',0,'C5',0,'A4',0,'B4','C5',
  'D5',0,'C5',0,'A4',0,'F4','G4',
  'E5',0,'G5',0,'C5',0,'E5','D5',
  'B4',0,'G4',0,'D5',0,'B4',0,
  'E5',0,'C5',0,'A4',0,'B4','C5',
  'D5',0,'F5',0,'C5',0,'A4','C5',
  'E5','G5','E5',0,'C5',0,'D5','E5',
  'D5','B4','G4',0,'A4','B4','C5',0
];
const BASS=[
  'A2','A2','E2','E2','F2','F2','C3','C3',
  'C3','C3','G2','G2','G2','G2','D3','D3',
  'A2','A2','E2','E2','F2','F2','C3','C3',
  'C3','G3','E3','C3','G2','G2','B2','D3'
];
const BGM_STEP=.24;
let bgmOn=false,bgmStep=0,bgmNext=0;
function startBGM(){
  if(bgmOn)return;
  if(!audio())return;
  bgmOn=true;bgmStep=0;bgmNext=actx.currentTime+.15;
}
setInterval(()=>{
  if(!bgmOn||!actx||S.muted)return;
  /* 静音 / 后台节流后回来，先把落后的时间轴对齐，避免一次性爆出几百个音符 */
  if(bgmNext<actx.currentTime)bgmNext=actx.currentTime+.05;
  let guard=0;
  while(bgmNext<actx.currentTime+.35&&guard++<16){
    const L=LEAD[bgmStep%LEAD.length];
    if(L)tone(NOTE(L),'square',.042,bgmNext,.2);
    if(bgmStep%2===0){
      const B=BASS[(bgmStep>>1)%BASS.length];
      if(B)tone(NOTE(B),'triangle',.068,bgmNext,.42);
    }
    bgmNext+=BGM_STEP;bgmStep++;
  }
},110);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){bgmOn=false;}
  else if(!S.muted&&!bgmOn&&$('game').classList.contains('on')&&S.started){startBGM();}
});

/* ---------- 星空 ---------- */
const SKIES=[];
class Sky{
  constructor(cv,moon){
    this.cv=cv;this.cx=cv.getContext('2d');
    this.moon=moon;this.stars=[];this.W=0;this.H=0;this.shoot=null;
    this.moonR={x:0,y:0};this.painted=false;
    this.resize();SKIES.push(this);
  }
  resize(){
    const d=Math.min(window.devicePixelRatio||1,2);
    this.W=this.cv.clientWidth||0;this.H=this.cv.clientHeight||0;
    if(!this.W||!this.H){this.stars=[];return;}
    this.cv.width=this.W*d;this.cv.height=this.H*d;
    this.cx.setTransform(d,0,0,d,0,0);
    this.painted=false;
    this.stars=[];
    const n=Math.min(150,Math.floor(this.W*this.H/8000));
    for(let i=0;i<n;i++)this.stars.push({
      x:Math.random()*this.W,y:Math.random()*this.H*.85,
      s:Math.random()<.25?2:1,p:Math.random()*7,v:.6+Math.random()*1.8,
      c:Math.random()<.12?'#ffd8a8':(Math.random()<.3?'#b8d0ff':'#ffffff')
    });
    if(this.moon)this.moonR={x:this.W-108,y:58};
  }
  drawMoon(){
    const {x,y}=this.moonR,B=3,cx=this.cx;
    for(let gy=-7;gy<=7;gy++)for(let gx=-7;gx<=7;gx++){
      const d=Math.hypot(gx,gy);
      if(d<6.4){
        let c='#f8e8a8';
        if((gx===2&&gy===-2)||(gx===-3&&gy===1)||(gx===1&&gy===3))c='#e0c880';
        if(d>5.2)c='#fff6d0';
        cx.fillStyle=c;cx.fillRect(x+gx*B,y+gy*B,B,B);
      }
    }
  }
  spawnShoot(){this.shoot={x:this.W*(.25+Math.random()*.55),y:16+Math.random()*this.H*.25,vx:-3.4,vy:1.6,life:0};}
  tick(t){
    if(!this.cv.isConnected)return;
    if(!this.cv.getClientRects().length)return;   /* display:none 的祖先 → 不画 */
    if(!this.W||!this.H)this.resize();
    if(!this.W||!this.H)return;
    if(REDUCE&&this.painted)return;               /* 减弱动效：只画一帧 */
    this.painted=true;
    const cx=this.cx;
    cx.clearRect(0,0,this.W,this.H);
    for(const s of this.stars){
      cx.globalAlpha=.25+.75*Math.abs(Math.sin(t/1000*s.v+s.p));
      cx.fillStyle=s.c;cx.fillRect(s.x,s.y,s.s,s.s);
    }
    cx.globalAlpha=1;
    if(this.moon)this.drawMoon();
    if(!this.shoot&&Math.random()<.0012)this.spawnShoot();
    if(this.shoot){
      const s=this.shoot;s.x+=s.vx;s.y+=s.vy;s.life++;
      for(let i=0;i<8;i++){
        cx.globalAlpha=(1-i/8)*.9;cx.fillStyle='#fff';
        cx.fillRect(s.x-s.vx*i,s.y-s.vy*i,2,2);
      }
      cx.globalAlpha=1;
      if(s.life>70||s.x<-20||s.y>this.H)this.shoot=null;
    }
  }
  inMoon(px,py){const {x,y}=this.moonR;return Math.abs(px-x)<28&&Math.abs(py-y)<28;}
}
(function raf(t){SKIES.forEach(s=>s.tick(t||0));requestAnimationFrame(raf);})(0);
window.addEventListener('resize',()=>SKIES.forEach(s=>s.resize()));
window.addEventListener('orientationchange',()=>setTimeout(()=>SKIES.forEach(s=>s.resize()),200));

/* ---------- 进度计算 ---------- */
function expProgress(){
  const t=new Date();
  let last=new Date(t.getFullYear(),0,30);
  if(t<last)last=new Date(t.getFullYear()-1,0,30);
  const next=new Date(last.getFullYear()+1,0,30);
  return{
    level:last.getFullYear()-2006,
    pct:Math.min(99,Math.floor((t-last)/(next-last)*100)),
    days:Math.max(1,Math.ceil((next-t)/86400000))
  };
}
const ENROLL=new Date(2024,8,1), GRAD=new Date(2028,5,30);
function questProgress(){
  const t=Date.now();
  const pct=Math.max(2,Math.min(99,Math.round((t-ENROLL)/(GRAD-ENROLL)*100)));
  const days=Math.max(0,Math.ceil((GRAD-t)/86400000));
  return{pct,days};
}
function fmtDur(ms){
  const s=Math.max(1,Math.floor(ms/1000));
  const m=Math.floor(s/60);
  if(m>=60)return Math.floor(m/60)+' 小时 '+(m%60)+' 分';
  return m+' 分 '+(s%60)+' 秒';
}
function fmtDate(ts){
  if(!ts)return '—';
  const d=new Date(ts);
  return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
}

function toast(msg){
  const t=document.createElement('div');

function confetti(n,glyph){
  if(REDUCE)return;
  for(let i=0;i<n;i++){
    const e=document.createElement('div');
    e.className='cf';
    e.style.left=(Math.random()*100)+'vw';

      e.textContent=glyph;

      e.style.background='transparent';

    }
    e.style.animationDuration=(1.7+Math.random()*2.1)+'s';
    e.style.animationDelay=(Math.random()*.7)+'s';
    cfLayer.appendChild(e);
    e.addEventListener('animationend',()=>e.remove());
  }
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea');
  ta.value=txt;ta.setAttribute('readonly','');
  ta.style.position='fixed';ta.style.top='-1000px';ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select();ta.setSelectionRange(0,txt.length);
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){ok=false;}
  ta.remove();
  toast(ok?('已复制：'+txt):('请手动记录：'+txt));
}
function copyText(txt){
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(txt).then(()=>toast('已复制：'+txt)).catch(()=>fallbackCopy(txt));
  }else fallbackCopy(txt);
}

let dQueue=[],dFull='',dCps=[],dPos=0,dTyping=false,dTimer=null,idleTimer=null;
const IDLE_HINTS=[
  '提示：带「?」的建筑里都藏着情报。',
  '收集齐 7 处情报，村口会发生变化……',
  '今晚的月亮很圆。要不要点一下试试？',

  '听说村里流传着「上上下下左右左右」的传说。',
  '火锅的情报，藏在宝箱屋里。',
  '头像偶尔会眨眼。盯着看就知道了。',
  'F12 里，可能有神秘人留了话。',
  '书亦烧仙草，三分糖，少冰，加珍珠。就这样。',
  '油碟里那勺麻酱，是他的私心。'
];
function say(lines){
  dQueue=Array.isArray(lines)?lines.slice():[lines];
  clearTimeout(dTimer);
  nextLine();
}
/* 追加到队尾，而不是覆盖 —— 用来修「第 7 个房间的台词被秘密基地吞掉」 */
function enqueue(lines){
  const arr=Array.isArray(lines)?lines.slice():[lines];
  if(dTyping||dQueue.length){dQueue=dQueue.concat(arr);}
  else say(arr);
}
function nextLine(){
  clearInterval(idleTimer);idleTimer=null;
  if(!dQueue.length){dNext.classList.remove('show');startIdle();return;}
  dFull=dQueue.shift();
  dCps=[...dFull];dPos=0;dTyping=true;
  dNext.classList.remove('show');
  typeStep();
}
function typeStep(){
  if(!dTyping)return;
  if(dPos<dCps.length){
    dPos++;
    dText.textContent=dCps.slice(0,dPos).join('');
    if(dPos%3===0)sfx.type();
    dTimer=setTimeout(typeStep,40);
  }else{
    dTyping=false;
    dNext.classList.add('show');
    dTimer=setTimeout(nextLine,2400);
  }
}
function advanceDialog(){
  if(dTyping){
    dTyping=false;clearTimeout(dTimer);
    dText.textContent=dFull;
    dNext.classList.add('show');
    dTimer=setTimeout(nextLine,2000);
  }else if(dQueue.length){
    clearTimeout(dTimer);
    nextLine();
  }
}
$('dialog').addEventListener('click',advanceDialog);
$('dialog').addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();advanceDialog();}
});
function startIdle(){
  if(idleTimer)return;
  idleTimer=setInterval(()=>{
    if(modal.classList.contains('show')||$('cert').classList.contains('show'))return;
    if(dTyping||dQueue.length)return;
    say(pick(IDLE_HINTS));
  },9000);
}

function bindHotpot(body){
  const wrap=body.querySelector('#mgHot');
  if(!wrap)return;
  const res=wrap.querySelector('#mgHotRes');
  const chosen=new Set();
  wrap.querySelectorAll('.mg-p').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const v=btn.dataset.v;
      if(chosen.has(v)){chosen.delete(v);btn.classList.remove('on');}
      else{chosen.add(v);btn.classList.add('on');}
      sfx.blip();
      res.textContent='';res.className='mg-res';
    });
  });
  wrap.querySelector('#mgHotReset').addEventListener('click',()=>{
    chosen.clear();
    wrap.querySelectorAll('.mg-p').forEach(b=>b.classList.remove('on'));
    res.textContent='';res.className='mg-res';sfx.cancel();
  });
  wrap.querySelector('#mgHotGo').addEventListener('click',()=>{
    const extra=[...chosen].filter(x=>SAUCE_TARGET.indexOf(x)<0);
    const miss=SAUCE_TARGET.filter(x=>!chosen.has(x));
    if(!extra.length&&!miss.length){
      res.className='mg-res ok';
      res.textContent='✔ 认证通过。香油打底、香菜葱花、一把小米辣，最后压一勺麻酱——就是这碗。';
      if(!S.eggs.hotpot){
        S.eggs.hotpot=1;save();
        toast('隐藏事件【口味认证 · 油碟】发现！');
        sfx.egg();confetti(24,'🌶');
      }else{sfx.confirm();}
    }else{
      res.className='mg-res no';
      if(extra.length)res.textContent='多了「'+extra.join('、')+'」。有些配料会把麻酱的味道盖掉。';
      else res.textContent='还差「'+miss.join('、')+'」。川渝老式油碟的底子，别漏了。';
      sfx.no();
    }
  });
}

function bindTea(body){
  const wrap=body.querySelector('#mgTea');
  if(!wrap)return;
  const res=wrap.querySelector('#mgTeaRes');
  const sel={sugar:'',ice:'',top:''};
  wrap.querySelectorAll('.mg-row').forEach(row=>{
    const g=row.dataset.g;
    row.querySelectorAll('.mg-s').forEach(btn=>{
      btn.addEventListener('click',()=>{
        row.querySelectorAll('.mg-s').forEach(b=>b.classList.remove('on'));
        btn.classList.add('on');
        sel[g]=btn.dataset.v;
        sfx.blip();
        res.textContent='';res.className='mg-res';
      });
    });
  });
  wrap.querySelector('#mgTeaReset').addEventListener('click',()=>{
    sel.sugar=sel.ice=sel.top='';
    wrap.querySelectorAll('.mg-s').forEach(b=>b.classList.remove('on'));
    res.textContent='';res.className='mg-res';sfx.cancel();
  });
  wrap.querySelector('#mgTeaGo').addEventListener('click',()=>{
    if(!sel.sugar||!sel.ice||!sel.top){
      res.className='mg-res no';res.textContent='还没点完：糖度、冰度、配料，三样都要选。';sfx.no();return;
    }
    const bad=[];
    if(sel.sugar!==ME.tea.sugar)bad.push('糖度');
    if(sel.ice!=='少冰'&&sel.ice!=='去冰')bad.push('冰度');
    if(sel.top!==ME.tea.top)bad.push('配料');
    if(!bad.length){
      res.className='mg-res ok';
      res.textContent='✔ 认证通过。'+ME.tea.brand+'，三分糖，少冰，珍珠——老板，就这个。';
      if(!S.eggs.milktea){
        S.eggs.milktea=1;save();
        toast('隐藏事件【口味认证 · 奶茶】发现！');
        sfx.egg();confetti(24,'🧋');
      }else{sfx.confirm();}
    }else{
      res.className='mg-res no';
      let hint;
      if(sel.top==='果粒')hint='果粒是他的雷区。这条比糖度还严格。';
      else if(bad.indexOf('糖度')>=0)hint='糖度不对。他永远只点三分糖。';
      else if(bad.indexOf('冰度')>=0)hint='冰度不对。正常冰会把它冲淡，热饮不在他的选项里。';
      else hint='配料不对。他只加珍珠。';
      res.textContent=hint+(bad.length>1?('（'+bad.join('、')+' 都不对）'):'');
      sfx.no();
    }
  });
}

function soulQ(body,qi,correct){
  const item=QUIZ[qi];
  body.innerHTML='<div class="q-head">灵魂拷问 · '+(qi+1)+'/'+QUIZ.length+'</div>'
   +'<h3 class="q-title">'+item.q+'</h3>'
   +'<div class="q-opts">'
   +item.opts.map((o,i)=>'<button class="pxbtn q-opt" data-i="'+i+'">'+o.t+'</button>').join('')
   +'</div>'
   +'<p class="room-intro" style="margin-top:12px">答对答错都没关系——反正答案都会告诉你。</p>';
  body.querySelectorAll('.q-opt').forEach(b=>b.addEventListener('click',()=>{
    const ok=item.opts[+b.dataset.i].ok;
    if(ok){sfx.confirm();correct++;}else{sfx.cancel();}
    body.innerHTML='<div class="q-head">灵魂拷问 · '+(qi+1)+'/'+QUIZ.length+'</div>'
     +'<h3 class="q-title">'+item.q+'</h3>'
     +'<div class="q-answer '+(ok?'right':'wrong')+'">'
     +(ok?'✔ 答对了！你比他想象的更懂他。':'✘ 答错了。但你摸清了一条排除项——很有侦探风范。')
     +'</div>'
     +'<div class="q-reveal">'+item.reveal+'</div>'
     +'<button class="pxbtn" id="qNext">'+(qi<QUIZ.length-1?'下一问 ▶':'查看最终图鉴 ▶')+'</button>';

      }
    });
  }));
}

let gameSky=null,titleSky=null;
function initTitle(){
  titleSky=new Sky($('tSky'),true);

function startGame(){
  audio();
  if(!S.muted)startBGM();
  if(!S.started){S.firstSeen=Date.now();S.started=Date.now();}
  const prev=S.lastSeen||0;
  S.visits=(S.visits||0)+1;
  S.lastSeen=Date.now();
  save();
  $('title').classList.add('gone');
  game.classList.add('on');
  game.classList.remove('poweron');void game.offsetWidth;game.classList.add('poweron');
  if(!gameOn){
    gameOn=true;
    gameSky=new Sky($('sky'),true);
    buildVillage();
    $('sky').addEventListener('click',e=>{
      const r=$('sky').getBoundingClientRect();
      if(gameSky.inMoon(e.clientX-r.left,e.clientY-r.top))moonClick(gameSky);
    });
    $('btnLog').addEventListener('click',()=>{
      audio();sfx.open();curRoom='log';
      winIcon.textContent='📖';winTitle.textContent='冒险图鉴';
      winBody.innerHTML='';renderLog(winBody);
      modal.classList.add('show');winBody.scrollTop=0;
    });
    $('btnBgm').addEventListener('click',()=>{
      audio();
      S.muted=!S.muted;save();
      if(master)master.gain.value=S.muted?0:1;
      if(!S.muted&&bgmOn&&actx)bgmNext=actx.currentTime+.05;
      if(!S.muted&&!bgmOn&&S.started)startBGM();
      $('btnBgm').textContent=S.muted?'🔇':'🔊';
      toast(S.muted?'声音：关':'声音：开');
    });
    $('hudInfo').addEventListener('click',()=>{
      audio();sfx.blip();
      const m=missingRooms();
      toast(m.length?('还差 '+m.length+' 处：'+m.join('、')):'情报已全部收集，去村口看看');
    });
    $('btnBgm').textContent=S.muted?'🔇':'🔊';
  }
  updateHUD();updateBuildings(true);redrawAvatars();
  if(prev){
    const d=Math.floor((Date.now()-prev)/86400000);
    if(d>=1)setTimeout(()=>toast('距上次来访已经 '+d+' 天了'),1200);
  }
  say([
    '欢迎来到李家村。这里保存着关于「李俊澄」的冒险档案。',
    '带「?」的建筑里都藏着情报，点进去看看吧。',
    '收集齐 7 处情报……会发生好事。✨'
  ]);
}

initTitle();
